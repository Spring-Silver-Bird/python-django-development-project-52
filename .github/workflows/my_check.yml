name: my-check

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install deps
        run: make setup

      - name: Collect static files
        run: make collectstatic

      - name: Lint (ruff)
        run: make lint

      - name: Tests with coverage
        run: make tests